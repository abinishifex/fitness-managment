name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
  mongodb:
    image: mongo:7
    ports:
      - 27017:27017
    options: >-
      --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - - name: Test
  run: npm test
  env:
    NODE_ENV: test
    MONGODB_URI_TEST: mongodb://127.0.0.1:27017/gym-trainer-test
